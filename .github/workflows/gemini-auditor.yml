name: Gemini Auditor

on:
  push:
    branches: [ main, dev ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    # Prevent running untrusted fork PRs that could attempt secret exfiltration
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Pinned actions/checkout for supply chain security
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for Gemini Key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY is not set. Skipping audit."
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Gemini Audit
        if: steps.check_key.outputs.has_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_MODEL: "gemini-3.5-flash"
        run: |
          # 1. Capture the git diff depending on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_DATA=$(git diff origin/${{ github.base_ref }}...HEAD)
          else
            DIFF_DATA=$(git diff HEAD~1 HEAD 2>/devnull || git diff)
          fi

          if [ -z "$DIFF_DATA" ]; then
            echo "No changes detected in diff. Skipping API call."
            exit 0
          fi

          # 2. Query reachable models supporting generateContent
          AVAILABLE_MODELS=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            | jq -r '.models[]? | select(.supportedGenerationMethods? | index("generateContent")) | .name' || true)

          # Normalize model names (strip 'models/' prefix)
          NORMALIZED=$(printf '%s\n' "$AVAILABLE_MODELS" | sed 's#^models/##')

          # Fallback check if requested model is unavailable to this key
          if ! printf '%s\n' "$NORMALIZED" | grep -xq "${GEMINI_MODEL}"; then
            FALLBACK=$(printf '%s\n' "$NORMALIZED" | head -n1 || true)
            if [ -n "$FALLBACK" ]; then
              echo "::warning::Configured GEMINI_MODEL '${GEMINI_MODEL}' not reachable; falling back to '${FALLBACK}'."
              GEMINI_MODEL="$FALLBACK"
            else
              echo "::error::No models available that support generateContent for this API key."
              exit 1
            fi
          fi

          echo "Using Gemini model: ${GEMINI_MODEL}"

          # 3. Build JSON payload
          PROMPT="You are acting as the Auditor per GEMINI.md and AGENTS.md. Review the following repository diff for cross-file drift, internal inconsistencies, and Apple HIG/SDK compliance. Be concise and action-oriented.\n\nDiff:\n$DIFF_DATA"
          PAYLOAD=$(jq -n --arg msg "$PROMPT" '{contents: [{parts: [{text: $msg}]}]}')

          # 4. Call Gemini API using resolved model
          RESPONSE=$(curl -s --fail-with-body -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -d "$PAYLOAD") || {
              echo "::error::Gemini API call failed with HTTP error:"
              echo "$RESPONSE"
              exit 1
            }

          # 5. Parse output text safely
          AUDIT_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$AUDIT_TEXT" ]; then
            echo "::error::Empty response received from Gemini API:"
            echo "$RESPONSE"
            exit 1
          fi

          # 6. Log output
          echo "### Gemini Audit Findings ###"
          echo "$AUDIT_TEXT"

          # 7. Post PR comment if running on PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMENT_BODY="### 🤖 Gemini Auditor Report (${GEMINI_MODEL})\n\n$AUDIT_TEXT"
            gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"
          fi
