name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Apple's frameworks (SwiftUI, SwiftData, CloudKit, StoreKit) do not exist
    # on Linux, so this has to run on a macOS runner even though Mac minutes
    # cost roughly ten times what Linux ones do. See docs/architecture.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Choose an iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 .github/scripts/choose-simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # `swift build` compiles for the *host*, which is macOS — a platform none
      # of this ever ships on. Building against an iOS simulator destination
      # tests what the apps actually run on.
      #
      # The scheme is PlugAndPlay-Package: Xcode generates one scheme per
      # library product plus an aggregate carrying the `-Package` suffix. The
      # bare package name is not a scheme, and using it fails with "workspace
      # does not contain a scheme named PlugAndPlay", which reads like the
      # package is broken rather than like the name is wrong.
      - name: Build and test on iOS
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme PlugAndPlay-Package \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult

      - name: Keep the result bundle when something fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
