name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Apple's frameworks (SwiftUI, SwiftData, CloudKit, StoreKit) do not exist
    # on Linux, so this has to run on a macOS runner even though Mac minutes
    # cost roughly ten times what Linux ones do. See docs/architecture.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # Temporary. Reports what this runner actually offers so the move from
      # `swift build` (which compiles for macOS) to `xcodebuild` against an iOS
      # simulator can be written from facts rather than guesses. Removed in the
      # commit that makes that switch.
      - name: What does this runner have?
        run: |
          echo "===== schemes xcodebuild sees in this package ====="
          xcodebuild -list -json || echo "(xcodebuild -list failed)"
          echo
          echo "===== available iPhone simulators ====="
          xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; [print(rt, "|", x["name"], "|", x["udid"]) for rt, xs in d.items() for x in xs if "iPhone" in x["name"]]' \
            || echo "(simctl listing failed)"
          echo
          echo "===== destinations for the package ====="
          xcodebuild -showdestinations -scheme PlugAndPlay 2>&1 | head -40 \
            || echo "(showdestinations failed for scheme PlugAndPlay)"

      - name: Build
        run: swift build

      - name: Test
        run: swift test
